        // --- WEB AUDIO API SYNTHESIZER FOR SOUND EFFECTS ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!state.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                // Happy Arpeggio
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            } else if (type === 'wrong') {
                // Low gentle boop
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'click') {
                // Gentle pop
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'star') {
                // Sparkling chime
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.setValueAtTime(1760, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // --- SPEECH SYNTHESIS API (TTS) FOR MALAY / ENGLISH ---
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Stop ongoing speech

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85; // Slightly slower for kids
            utterance.pitch = 1.2; // Cheerful friendly pitch

            // Prefer Malay voice if available, fallback to Indonesian/English
            const voices = window.speechSynthesis.getVoices();
            if (state.lang === 'ms') {
                const msVoice = voices.find(v => v.lang.includes('ms') || v.lang.includes('id'));
                if (msVoice) utterance.voice = msVoice;
            } else {
                const enVoice = voices.find(v => v.lang.includes('en'));
                if (enVoice) utterance.voice = enVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // SAVE PROFILE DATA TO LOCALSTORAGE & FIREBASE
        function saveProfile() {
            localStorage.setItem('math_easy_profile', JSON.stringify(state.profile));
            document.getElementById('header-stars').innerText = state.profile.stars;
            document.getElementById('header-avatar').innerText = state.profile.avatar;

            // Sync to Firebase if available
            if (window.db && window.firebaseRef && window.firebaseSet) {
                try {
                    const userRef = window.firebaseRef(window.db, 'users/' + state.profile.name.toLowerCase().replace(/\s+/g, '_'));
                    window.firebaseSet(userRef, {
                        ...state.profile,
                        updatedAt: new Date().toISOString()
                    });
                } catch(e) {
                    console.log("Firebase sync skipped:", e);
                }
            }
        }

            playSound('click');
            state.lang = state.lang === 'ms' ? 'en' : 'ms';
            localStorage.setItem('math_easy_lang', state.lang);
            document.getElementById('current-lang-code').innerText = state.lang.toUpperCase();
            renderCurrentPage();

        // --- NAVIGATION CONTROLLER ---
        function switchTab(tabId) {
            playSound('click');
            state.currentTab = tabId;

            // Show/Hide Header & Bottom Nav
            const header = document.getElementById('main-header');
            const nav = document.getElementById('bottom-nav');

            if (tabId === 'splash' || tabId === 'language_select') {
                header.classList.add('hidden');
                nav.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
                nav.classList.remove('hidden');
            }

            // Update Nav Active State
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-600', 'bg-blue-50');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById('nav-' + tabId);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-blue-600', 'bg-blue-50');
            }

            renderCurrentPage();
        }

                    break;
                case 'language_select':

                    break;
                case 'home':

                    break;
                case 'learn':

                    break;
                case 'learn_numbers':

                case 'learn_counting':

                case 'learn_shapes':

                case 'game_catch':

                case 'quiz':

                    break;

            { id: 'square', nameMs: 'Segi Empat Sama', nameEn: 'Square', icon: '🟧', exampleMs: 'Biskut, Dadus', exampleEn: 'Biscuit, Dice' },

            { id: 'rectangle', nameMs: 'Segi Empat Tepat', nameEn: 'Rectangle', icon: '🟦', exampleMs: 'Pintu, Pembaris', exampleEn: 'Door, Ruler' },
            { id: 'star', nameMs: 'Bintang', nameEn: 'Star', icon: '⭐', exampleMs: 'Bintang Laut', exampleEn: 'Starfish' }
        ];
        let shapeIndex = 0;

        function renderLearnShapesScreen() {
            const shp = shapesData[shapeIndex];
            const title = state.lang === 'ms' ? shp.nameMs : shp.nameEn;
            const example = state.lang === 'ms' ? shp.exampleMs : shp.exampleEn;

            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button onclick="switchTab('learn')" class="bouncy text-slate-600 bg-white border border-slate-200 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-arrow-left"></i> ${t('btn_back')}
                        </button>
                        <span class="font-extrabold text-purple-600 text-lg">${t('cat_shapes')}</span>
                        <div class="w-12"></div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 border-4 border-purple-300 shadow-xl text-center space-y-4">
                        <div class="text-8xl bouncy my-2">${shp.icon}</div>
                        <h3 class="text-3xl font-black text-purple-700">${title}</h3>
                        
                        <div class="bg-purple-50 p-3 rounded-2xl border border-purple-200 text-sm font-bold text-purple-900">
                            <span>Contoh Objek:</span> ${example}
                        </div>

                        <button onclick="speakText('${title}')" class="bouncy w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 px-6 rounded-2xl shadow-md border-b-4 border-purple-700 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-volume-high text-xl"></i>
                            <span>${t('btn_listen')}</span>
                        </button>
                    </div>

                    <!-- Shape Nav Buttons -->
                    <div class="flex items-center justify-between gap-3 pt-2">
                        <button onclick="changeShape(-1)" class="bouncy bg-purple-600 text-white p-3.5 rounded-2xl font-bold flex-1 shadow-md border-b-4 border-purple-800 flex items-center justify-center gap-1">
                            <i class="fa-solid fa-chevron-left"></i> ${t('btn_prev')}
                        </button>
                        <button onclick="changeShape(1)" class="bouncy bg-purple-600 text-white p-3.5 rounded-2xl font-bold flex-1 shadow-md border-b-4 border-purple-800 flex items-center justify-center gap-1">
                            ${t('btn_next')} <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function changeShape(delta) {
            playSound('click');
            shapeIndex = (shapeIndex + delta + shapesData.length) % shapesData.length;
            state.profile.completed.shapes = Math.min(100, (state.profile.completed.shapes || 0) + 20);
            saveProfile();
            renderCurrentPage();
        }

        // --- 10. GAMES MENU SCREEN ---
        function renderGamesMenuScreen() {
            return `
                <div class="space-y-4">
                    <div class="text-center mb-2">
                        <h2 class="text-2xl font-extrabold text-orange-600">${t('cat_games')}</h2>
                        <p class="text-xs text-slate-500 font-semibold">Bermain sambil belajar matematik!</p>
                    </div>

                    <div class="space-y-3">
                        <div onclick="switchTab('game_catch')" class="bouncy bg-white p-4 rounded-3xl border-2 border-orange-300 shadow-md flex items-center gap-4 cursor-pointer">
                            <div class="w-16 h-16 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-3xl shrink-0">🎯</div>
                            <div class="flex-1">
                                <h3 class="font-bold text-lg text-slate-800">Cari Nombor (Catch Number)</h3>
                                <p class="text-xs text-slate-500">Tekan nombor sasaran yang dipaparkan!</p>
                            </div>
                            <i class="fa-solid fa-play text-orange-500 text-2xl"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 11. GAME 1: CATCH THE NUMBER ---
        let catchTarget = 5;
        let catchScore = 0;
        function renderGameCatchScreen() {
            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button onclick="switchTab('games')" class="bouncy text-slate-600 bg-white border border-slate-200 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-arrow-left"></i> ${t('btn_back')}
                        </button>
                        <span class="font-extrabold text-orange-600 text-lg">Cari Nombor!</span>
                        <div class="text-xs font-bold bg-amber-100 border border-amber-300 px-2.5 py-1 rounded-full text-amber-800">
                            Skor: <span id="catch-score">0</span>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-4 border-4 border-orange-300 shadow-xl text-center">
                        <div class="text-lg font-bold text-slate-800 mb-3">
                            ${state.lang === 'ms' ? 'Cari dan tekan nombor:' : 'Find and tap number:'}
                            <span id="catch-target-display" class="text-4xl font-black text-orange-600 ml-2 animate-bounce inline-block">5</span>
                        </div>

                        <!-- Interactive Number Grid -->
                        <div id="catch-grid" class="grid grid-cols-3 gap-3 p-2 bg-orange-50 rounded-2xl border border-orange-200 min-h-[220px]">
                            <!-- Generated dynamically -->
                        </div>
                    </div>
                </div>
            `;
        }

        function initCatchGame() {
            catchScore = 0;
            generateCatchRound();
        }

        function generateCatchRound() {
            catchTarget = Math.floor(Math.random() * 10) + 1; // 1 to 10
            const targetDisp = document.getElementById('catch-target-display');
            if (targetDisp) targetDisp.innerText = catchTarget;

            // Generate 6 numbers, 1 guaranteed target
            const nums = [catchTarget];
            while (nums.length < 6) {
                const rand = Math.floor(Math.random() * 10) + 1;
                nums.push(rand);
            }
            nums.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('catch-grid');
            if (!grid) return;
            grid.innerHTML = nums.map(n => `
                <button onclick="handleCatchTap(${n})" class="bouncy bg-white text-3xl font-black text-blue-600 h-20 rounded-2xl shadow-md border-b-4 border-blue-200 flex items-center justify-center hover:bg-yellow-100">
                    ${n}
                </button>
            `).join('');
        }

        function handleCatchTap(num) {
            if (num === catchTarget) {
                playSound('correct');
                catchScore += 1;
                state.profile.stars += 1;
                const scoreElem = document.getElementById('catch-score');
                if (scoreElem) scoreElem.innerText = catchScore;
                saveProfile();
                confetti({ particleCount: 30, spread: 40 });
                generateCatchRound();
            } else {
                playSound('wrong');
            }
        }

        // --- 12. QUIZ SYSTEM ---
        let currentQuizIndex = 0;
        let quizScore = 0;
        const quizQuestions = [
            { type: 'count', prompt: 'Berapa biji epal ini?', emoji: '🍎🍎🍎', answer: 3, options: [2, 3, 4, 5] },
            { type: 'addition', prompt: 'Berapakah 2 + 2?', emoji: '⭐', answer: 4, options: [3, 4, 5, 6] },
            { type: 'subtraction', prompt: 'Berapakah 5 - 1?', emoji: '🎈', answer: 4, options: [2, 3, 4, 5] },
            { type: 'shape', prompt: 'Apakah nama bentuk 🔺 ini?', emoji: '🔺', answer: 'Segi Tiga', options: ['Bulatan', 'Segi Tiga', 'Bintang', 'Segi Empat'] },
            { type: 'number', prompt: 'Nombor apakah selepas 4?', emoji: '🔢', answer: 5, options: [3, 5, 6, 7] }
        ];

        function renderQuizScreen() {
            currentQuizIndex = 0;
            quizScore = 0;
            return renderQuizQuestionScreen();
        }

        function renderQuizQuestionScreen() {
            if (currentQuizIndex >= quizQuestions.length) {
                return renderQuizResultsScreen();
            }

            const q = quizQuestions[currentQuizIndex];

            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button onclick="switchTab('home')" class="bouncy text-slate-600 bg-white border border-slate-200 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-arrow-left"></i> ${t('btn_back')}
                        </button>
                        <span class="font-extrabold text-amber-600 text-lg">${t('cat_quiz')}</span>
                        <span class="text-xs font-bold text-slate-500 bg-white px-2.5 py-1 rounded-full border">
                            ${currentQuizIndex + 1} / ${quizQuestions.length}
                        </span>
                    </div>

                    <div class="bg-white rounded-3xl p-5 border-4 border-amber-300 shadow-xl text-center space-y-4">
                        <h3 class="text-lg font-bold text-slate-800">${q.prompt}</h3>
                        
                        <div class="bg-amber-50 rounded-2xl p-6 text-5xl border border-amber-200">
                            ${q.emoji}
                        </div>

                        <div class="grid grid-cols-2 gap-3 pt-2">
                            ${q.options.map(opt => `
                                <button onclick="answerQuiz('${opt}')" class="bouncy bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-900 font-extrabold text-2xl py-4 rounded-2xl shadow-md border-b-4 border-amber-600">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function answerQuiz(selected) {
            const q = quizQuestions[currentQuizIndex];
            if (String(selected) === String(q.answer)) {
                playSound('correct');
                quizScore += 1;
            } else {
                playSound('wrong');
            }
            currentQuizIndex += 1;
            renderCurrentPage();
        }

        function renderQuizResultsScreen() {
            const starsEarned = quizScore;
            state.profile.stars += starsEarned;
            state.profile.completed.quiz = Math.min(100, (state.profile.completed.quiz || 0) + 20);
            if (quizScore >= 4 && !state.profile.badges.includes('Math Hero')) {
                state.profile.badges.push('Math Hero');
            }
            saveProfile();

            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

            return `
                <div class="bg-white rounded-3xl p-6 border-4 border-amber-400 shadow-2xl text-center space-y-5 my-auto">
                    <div class="text-6xl float-anim">🎊</div>
                    <h2 class="text-3xl font-black text-amber-600">Syabas!</h2>
                    <p class="text-slate-600 font-bold">${t('score_label')}: ${quizScore} / ${quizQuestions.length}</p>

                    <div class="flex justify-center text-4xl gap-2 text-amber-400">
                        ${Array(5).fill(0).map((_, i) => `<i class="fa-solid fa-star ${i < quizScore ? 'text-amber-400' : 'text-slate-200'}"></i>`).join('')}
                    </div>

                    <p class="text-xs font-semibold text-slate-500">
                        Adik dapat +${starsEarned} bintang bonus! ⭐
                    </p>

                    <div class="flex gap-3 pt-2">
                        <button onclick="switchTab('quiz')" class="bouncy flex-1 bg-amber-400 text-amber-950 font-bold p-3.5 rounded-2xl border-b-4 border-amber-600">
                            ${t('btn_play_again')}
                        </button>
                        <button onclick="switchTab('home')" class="bouncy flex-1 bg-blue-500 text-white font-bold p-3.5 rounded-2xl border-b-4 border-blue-700">
                            ${t('btn_back')}
                        </button>
                    </div>
                </div>
            `;
        }

        // --- 13. REWARDS & BADGES SCREEN ---
        function renderRewardsScreen() {
            const allBadges = [
                { id: 'Number Explorer', icon: '🔢', desc: 'Belajar nombor 1–10' },
                { id: 'Counting Star', icon: '🍎', desc: 'Jawab 10 soalan kiraan' },
                { id: 'Math Hero', icon: '🏆', desc: 'Selesaikan kuiz dengan cemerlang' },
                { id: 'Shape Master', icon: '🔺', desc: 'Kuasai semua bentuk asas' }
            ];

            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button onclick="switchTab('home')" class="bouncy text-slate-600 bg-white border border-slate-200 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-arrow-left"></i> ${t('btn_back')}
                        </button>
                        <span class="font-extrabold text-purple-600 text-lg">${t('cat_rewards')}</span>
                        <div class="w-12"></div>
                    </div>

                    <div class="bg-gradient-to-r from-purple-500 to-pink-500 rounded-3xl p-5 text-white text-center shadow-lg">
                        <div class="text-4xl mb-1">⭐ ${state.profile.stars}</div>
                        <h3 class="font-black text-xl">Bintang Dikumpul</h3>
                    </div>

                    <div class="space-y-3">
                        <h4 class="font-bold text-slate-700 text-sm">Lencana Pencapaian:</h4>
                        ${allBadges.map(b => {
                            const isEarned = state.profile.badges.includes(b.id);
                            return `
                                <div class="bg-white p-4 rounded-2xl border-2 ${isEarned ? 'border-amber-300' : 'border-slate-200 opacity-60'} flex items-center gap-3 shadow-sm">
                                    <div class="text-4xl">${b.icon}</div>
                                    <div class="flex-1">
                                        <div class="font-bold text-slate-800 text-sm">${b.id}</div>
                                        <div class="text-xs text-slate-500">${b.desc}</div>
                                    </div>
                                    ${isEarned ? '<span class="text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full">Diberi!</span>' : '<span class="text-xs text-slate-400">Terkunci</span>'}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- 14. PROGRESS TRACKING PAGE ---
        function renderProgressScreen() {
            const comp = state.profile.completed || {};
            return `
                <div class="space-y-4">
                    <div class="text-center mb-2">
                        <h2 class="text-2xl font-extrabold text-blue-600">${t('nav_progress')}</h2>
                        <p class="text-xs text-slate-500 font-semibold">Kemajuan pembelajaran ${state.profile.name}</p>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border-2 border-sky-200 shadow-md space-y-4">
                        ${renderProgressBar('Nombor (1-20)', comp.numbers || 20, 'bg-blue-500')}
                        ${renderProgressBar('Kira-kira', comp.counting || 40, 'bg-amber-500')}
                        ${renderProgressBar('Tambah', comp.addition || 30, 'bg-emerald-500')}
                        ${renderProgressBar('Tolak', comp.subtraction || 20, 'bg-rose-500')}
                        ${renderProgressBar('Bentuk', comp.shapes || 50, 'bg-purple-500')}
                        ${renderProgressBar('Kuiz', comp.quiz || 60, 'bg-yellow-500')}
                    </div>
                </div>
            `;
        }

        function renderProgressBar(label, val, colorClass) {
            return `
                <div>
                    <div class="flex justify-between text-xs font-bold text-slate-700 mb-1">
                        <span>${label}</span>
                        <span>${val}%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-3.5 border border-slate-200 overflow-hidden">
                        <div class="${colorClass} h-full rounded-full transition-all duration-500" style="width: ${val}%"></div>
                    </div>
                </div>
            `;
        }

        // --- 15. MODALS ENGINE (PROFILE / PARENT / FEEDBACK) ---
        function showFeedbackModal(isCorrect, message, onNext) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl p-6 border-4 ${isCorrect ? 'border-emerald-400' : 'border-amber-400'} shadow-2xl text-center max-w-xs w-full space-y-4 animate-bounce" style="animation-iteration-count: 1;">
                        <div class="text-6xl">${isCorrect ? '🎉' : '😊'}</div>
                        <h3 class="text-2xl font-black ${isCorrect ? 'text-emerald-600' : 'text-amber-600'}">${message}</h3>
                        <button id="modal-next-btn" class="bouncy w-full ${isCorrect ? 'bg-emerald-500 border-emerald-700' : 'bg-amber-500 border-amber-700'} text-white font-bold py-3 rounded-2xl shadow-md border-b-4">
                            Teruskan ➔
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('modal-next-btn').onclick = () => {
                playSound('click');
                modal.innerHTML = '';
                if (onNext) onNext();
            };
        }

        function openProfileModal() {
            playSound('click');
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl p-5 border-4 border-purple-300 shadow-2xl max-w-xs w-full space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-extrabold text-lg text-slate-800">Profil Murid</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">Nama Adik:</label>
                            <input type="text" id="input-profile-name" value="${state.profile.name}" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-800 focus:outline-none focus:border-purple-500">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 block mb-1">Pilih Avatar:</label>
                            <div class="flex justify-around text-2xl bg-purple-50 p-2 rounded-xl border border-purple-200">
                                ${['👦', '👧', '🐱', '🐰', '🐻', '🐼'].map(a => `
                                    <button onclick="selectAvatar('${a}')" class="bouncy hover:scale-125">${a}</button>
                                `).join('')}
                            </div>
                        </div>

                        <button onclick="saveProfileChanges()" class="bouncy w-full bg-purple-600 text-white font-bold py-3 rounded-xl border-b-4 border-purple-800 shadow-md">
                            ${t('btn_save')}
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAvatar(avatar) {
            state.profile.avatar = avatar;
            openProfileModal();
        }

        function saveProfileChanges() {
            const input = document.getElementById('input-profile-name');
            if (input && input.value.trim()) {
                state.profile.name = input.value.trim();
            }
            saveProfile();
            closeModal();
            renderCurrentPage();
        }

        function openParentModal() {
            playSound('click');
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl p-5 border-4 border-blue-400 shadow-2xl max-w-xs w-full space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-extrabold text-lg text-slate-800">Mod Ibu Bapa & Guru</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <p class="text-xs text-slate-500 font-medium">Masukkan PIN untuk ke Kawalan Ibu Bapa (PIN Laluan: 1234):</p>
                        
                        <input type="password" id="parent-pin" maxlength="4" placeholder="****" class="w-full text-center text-2xl tracking-widest bg-slate-50 border-2 border-blue-200 rounded-xl p-2 font-bold focus:outline-none">

                        <button onclick="verifyParentPIN()" class="bouncy w-full bg-blue-600 text-white font-bold py-3 rounded-xl border-b-4 border-blue-800 shadow-md">
                            Masuk Mod Ibu Bapa
                        </button>
                    </div>
                </div>
            `;
        }

        function verifyParentPIN() {
            const pin = document.getElementById('parent-pin').value;
            if (pin === '1234' || pin === '0000') {
                closeModal();
                showParentDashboard();
            } else {
                playSound('wrong');
                alert("PIN Salah! Sila guna 1234");
            }
        }

        function showParentDashboard() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button onclick="switchTab('home')" class="bouncy text-slate-600 bg-white border border-slate-200 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-arrow-left"></i> ${t('btn_back')}
                        </button>
                        <span class="font-extrabold text-blue-700 text-lg">Dashboard Ibu Bapa</span>
                        <div class="w-12"></div>
                    </div>

                    <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <h4 class="font-bold text-slate-800 text-sm">💡 Cadangan Aktiviti Pembelajaran:</h4>
                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-xs text-amber-900 font-semibold leading-relaxed">
                            "${state.profile.name} menunjukkan prestasi sangat baik dalam tajuk <strong>Kenal Bentuk</strong>! Syorkan lebih banyak latihan dalam tajuk <strong>Tambah & Tolak</strong>."
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <h4 class="font-bold text-slate-800 text-sm">⚙️ Tetapan Aplikasi:</h4>
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-600">Kesan Bunyi (SFX)</span>
                            <input type="checkbox" ${state.soundEnabled ? 'checked' : ''} onchange="state.soundEnabled = this.checked;" class="w-5 h-5 accent-blue-600">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-600">Bahasa Aplikasi</span>
                            <button onclick="toggleLanguage()" class="text-xs font-bold bg-blue-100 text-blue-700 px-3 py-1 rounded-full">${state.lang.toUpperCase()}</button>
                        </div>
                    </div>

                    <button onclick="resetAppProgress()" class="bouncy w-full bg-rose-100 border border-rose-300 text-rose-700 font-bold p-3 rounded-2xl text-xs">
                        Reset Semua Kemajuan Pembelajaran
                    </button>
                </div>
            `;
        }

        function resetAppProgress() {
            if (confirm("Adakah anda pasti mahu mereset kemajuan pembelajaran anak anda?")) {
                localStorage.removeItem('math_easy_profile');
                location.reload();
            }
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        // INITIALIZE APP ON LOAD
        window.addEventListener('load', () => {
            // Apply language from storage
            document.getElementById('current-lang-code').innerText = state.lang.toUpperCase();
            document.getElementById('header-stars').innerText = state.profile.stars;
            document.getElementById('header-avatar').innerText = state.profile.avatar;

            // Start on splash screen
            switchTab('splash');
        });
    </script>
</body>
</html>
